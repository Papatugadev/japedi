<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Cardápio</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand__text">
        <h1 id="title">Carregando...</h1>
        <p id="desc"></p>
      </div>

      <button id="openCartBtn" class="iconbtn" type="button" aria-label="Abrir carrinho">
        🛒 <span id="cartBadge" class="badge hidden">0</span>
      </button>
    </div>
  </header>

  <main>
    <div id="products"></div>
  </main>

  <!-- Barra fixa do carrinho (aparece quando tem item) -->
  <div id="cartBar" class="cartbar hidden">
    <div>
      <div class="cartbar__line">
        <strong id="cartBarQty">0 itens</strong>
        <span id="cartBarTotal">R$ 0,00</span>
      </div>
      <small class="muted">Toque para revisar seu pedido</small>
    </div>
    <button id="cartBarBtn" class="btn" type="button">Ver carrinho</button>
  </div>

  <!-- Drawer do carrinho -->
  <div id="cartDrawer" class="drawer hidden" role="dialog" aria-modal="true">
    <div class="drawer__backdrop" id="closeDrawerBackdrop"></div>

    <div class="drawer__panel">
      <div class="drawer__header">
        <strong>Seu carrinho</strong>
        <button id="closeDrawerBtn" class="ghost" type="button">Fechar</button>
      </div>

      <div id="cartItems" class="drawer__content"></div>

      <div class="drawer__footer">
        <div class="drawer__totals">
          <span class="muted">Subtotal</span>
          <strong id="cartSubtotal">R$ 0,00</strong>
        </div>

        <button id="checkoutBtn" class="btn" type="button">Finalizar pedido</button>
      </div>
    </div>
  </div>
<!-- Checkout (modal simples) -->
<div id="checkoutModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal__backdrop" id="closeCheckoutBackdrop"></div>

  <div class="modal__panel">
    <div class="modal__header">
      <strong>Finalizar pedido</strong>
      <button id="closeCheckoutBtn" class="ghost" type="button">Fechar</button>
    </div>

    <div class="modal__content">
      <label class="label">Seu nome</label>
      <input id="custName" class="input" placeholder="Ex: Jorge" />

      <label class="label">WhatsApp</label>
      <input id="custPhone" class="input" placeholder="Ex: 11999999999" />

      <label class="label">Endereço / Observação</label>
      <textarea id="custAddr" class="input" rows="3" placeholder="Rua, número, bairro..."></textarea>
    </div>

    <div class="modal__footer">
      <button id="confirmOrderBtn" class="btn" type="button">Confirmar pedido</button>
    </div>
  </div>
</div>

<!-- Tela de acompanhar pedido -->
<div id="trackScreen" class="track hidden">
  <div class="track__panel">
    <h2 style="margin:0 0 10px">Acompanhar pedido</h2>
    <div class="box">
      <div><strong>Pedido:</strong> <span id="trackOrderId">-</span></div>
      <div style="margin-top:8px"><strong>Status:</strong> <span id="trackStatus">-</span></div>
      <div style="margin-top:8px" class="muted" id="trackUpdated">-</div>
    </div>
    <button id="backToMenuBtn" class="ghost" type="button">Voltar ao cardápio</button>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
