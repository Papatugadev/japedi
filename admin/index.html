<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Painel do Restaurante</title>
<link rel="stylesheet" href="./admin.css?v=cards1">
</head>

<body>

<div class="login" id="loginScreen">
  <h2>Painel do Restaurante</h2>

  <input id="email" placeholder="Email" class="input"/>
  <input id="password" type="password" placeholder="Senha" class="input"/>

  <button id="loginBtn" class="btn">Entrar</button>

  <p id="loginError" class="error"></p>
</div>

<div id="panel" class="hidden">
  <header class="top">
    <strong id="restName">Restaurante</strong>
    <button id="logoutBtn" class="ghost" type="button">Sair</button>
  </header>

  <div class="adminLayout">
    <aside class="sidebar" aria-label="Menu">
      <button class="menuItem active" type="button" data-page="orders" aria-label="Pedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg></button>
      <button class="menuItem" type="button" data-page="products" aria-label="Produtos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v10l-8 4-8-4V7l8-4z" /><path d="M12 7v14" /></svg></button>
      <button class="menuItem" type="button" data-page="finance" aria-label="Painel financeiro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5" /><path d="M8 17V9" /><path d="M12 19V7" /><path d="M16 17V11" /><path d="M20 19V5" /></svg></button>
      <button class="menuItem" type="button" data-page="settings" aria-label="Configurações"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a7.9 7.9 0 0 0 .1-1 7.9 7.9 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a8 8 0 0 0-1.7-1l-.4-2.6H10l-.4 2.6a8 8 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.9 7.9 0 0 0-.1 1 7.9 7.9 0 0 0 .1 1l-2 1.6 2 3.4 2.4-1a8 8 0 0 0 1.7 1l.4 2.6h4.2l.4-2.6a8 8 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6z"/></svg></button>
    </aside>

    <main class="contentArea">
      <section id="page-orders" class="page active">
  <h3 class="pageTitle" id="pageTitle">Pedidos</h3>

  <div class="kanban">
    <div class="kanCol" data-col="em_preparo">
      <div class="kanHead">
        <span class="kanDot dotPrep"></span>
        <span class="kanTitle" aria-label="Em preparo"></span>
      </div>
      <div id="orders-prep" class="kanList"></div>
    </div>

    <div class="kanCol" data-col="saiu_pra_entrega">
      <div class="kanHead">
        <span class="kanDot dotOut"></span>
        <span class="kanTitle" aria-label="Saiu pra entrega"></span>
      </div>
      <div id="orders-out" class="kanList"></div>
    </div>

    <div class="kanCol" data-col="entregue">
      <div class="kanHead">
        <span class="kanDot dotDone"></span>
        <span class="kanTitle" aria-label="Entregue"></span>
      </div>
      <div id="orders-done" class="kanList"></div>
    </div>
  </div>
</section>

      
      <section id="page-products" class="page">
        <h3 class="pageTitle">Produtos</h3>

        <div class="prodTop">
          <div class="prodSearch">
            <input id="prodSearch" class="input" placeholder="Buscar produto..." />
          </div>
          <button id="btnNewProduct" class="btn small" type="button">+ Novo</button>
        </div>

        <div id="productsList" class="prodGrid"></div>
        <p id="productsEmpty" class="muted hidden">Nenhum produto cadastrado ainda.</p>
      </section>


      <section id="page-finance" class="page">
        <h3 class="pageTitle">Financeiro</h3>
        <div class="placeholderCard"></div>
      </section>

      <section id="page-settings" class="page">
        <h3 class="pageTitle">Configurações</h3>
        <div class="placeholderCard"></div>
      </section>
    </main>
  </div>
</div>

<script type="module" src="./admin.js?v=cards1"></script>
</body>
</html>
