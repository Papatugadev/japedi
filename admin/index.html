<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Painel do Restaurante</title>
<link rel="stylesheet" href="./admin.css">
</head>

<body>

<div class="login" id="loginScreen">
  <h2>Painel do Restaurante</h2>

  <input id="email" placeholder="Email" class="input"/>
  <input id="password" type="password" placeholder="Senha" class="input"/>

  <button id="loginBtn" class="btn">Entrar</button>

  <p id="loginError" class="error"></p>
</div>

<div id="panel" class="hidden">
  <header class="top">
    <strong id="restName">Restaurante</strong>
    <button id="logoutBtn" class="ghost">Sair</button>
  </header>

  <main>
    <h3>Pedidos ao vivo</h3>
    <div id="orders"></div>
  </main>
</div>

<script type="module" src="./admin.js"></script>
</body>
</html>
